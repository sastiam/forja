name: Reporte de error
description: Algo no funciona como se espera
labels: ["type:bug"]
body:
  - type: dropdown
    id: host
    attributes:
      label: Host
      options: [macbook (macOS), fedora (planificado), raspi (planificado)]
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: Versión de macOS
      placeholder: "26.1"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Salida de `forja version`
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Salida de `forja doctor --json`
      description: Revisa que no contenga datos personales antes de pegarla.
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: No incluí emails, cuentas ni secretos en este reporte.
          required: true
