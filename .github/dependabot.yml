version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Los tipos siguen al mínimo de engines (node >=22.18): una API de Node 26
      # tiparía bien y fallaría en runtime en Node 22.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
