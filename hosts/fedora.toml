name = "fedora"
status = "supported"
os = "linux"
arch = "x86_64"
# Paquetes con dnf (packages.fedora.txt) y repos de terceros solo si los confías (thirdparty.fedora.toml, ADR 0017).
modules = ["core", "shell", "git", "runtimes", "agents", "containers", "worktrees", "looper", "terminal", "editor", "browsers"]

# Dominios que el sandbox de Claude Code deja salir en todas las máquinas de este tipo.
# Los personales (empresa, registries privados) van en profile.toml → [claude].
[claude]
allowed_domains = ["github.com", "api.github.com"]
