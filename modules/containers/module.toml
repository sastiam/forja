name = "containers"
summary = "Colima + Docker CLI + Floci + AWS CLI + CDK (AWS local)"
os = ["darwin"]
depends = ["core"]
targets = ["~/.aws/config", "~/.aws/credentials"]
risk = "medium"
requires_sudo = true
optional = false

[checks]
commands = ["docker context show", "floci --version", "aws --version", "cdk --version"]
