name = "git"
summary = "Git moderno, conflictos con mergiraf + Sublime Merge, rerere, zdiff3"
os = ["darwin", "linux"]
depends = ["core"]
targets = ["~/.config/git", "~/.config/lazygit"]
risk = "low"
requires_sudo = false
optional = false

[checks]
commands = ["git --version"]

# mergiraf y Sublime Merge: en Linux no están en Fedora (mergiraf) o son opcionales (repo de terceros).
[checks.darwin]
commands = ["mergiraf --version", "smerge --version"]
